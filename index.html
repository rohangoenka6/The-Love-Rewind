<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0d22" />
    <title>The Love Rewind 🎧</title>
    <meta name="description" content="The Love Rewind — your playlist, made with love." />
    <meta property="og:title" content="The Love Rewind 🎧" />
    <meta property="og:description" content="The Love Rewind — your playlist, made with love." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <!-- Night scene background -->
    <div class="scene">
      <video
        class="bg-video"
        autoplay
        muted
        loop
        playsinline
        aria-hidden="true"
      >
        <source src="background.mp4" type="video/mp4" />
      </video>
      <div class="bg-overlay" aria-hidden="true"></div>
      <div class="bg-blur" aria-hidden="true"></div>
      <div class="bg-image" aria-hidden="true"></div>

      <!-- Built-in placeholder scene (shown only if background.jpg is missing) -->
      <svg
        class="scene-svg"
        viewBox="0 0 1440 900"
        preserveAspectRatio="xMidYMax slice"
        aria-hidden="true"
      >
        <defs>
          <radialGradient id="skyGrad" cx="50%" cy="100%" r="90%">
            <stop offset="0%" stop-color="#241436" />
            <stop offset="45%" stop-color="#151a3d" />
            <stop offset="100%" stop-color="#0a0d22" />
          </radialGradient>
          <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fffbe6" stop-opacity="0.95" />
            <stop offset="35%" stop-color="#ffe9a3" stop-opacity="0.45" />
            <stop offset="70%" stop-color="#ffd36e" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffd36e" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="moonFace" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fffdf0" />
            <stop offset="85%" stop-color="#ffe9b0" />
            <stop offset="100%" stop-color="#f7d489" />
          </radialGradient>
          <linearGradient id="skylineGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1b1030" stop-opacity="0.95" />
            <stop offset="100%" stop-color="#0d0719" stop-opacity="1" />
          </linearGradient>
          <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0a0514" />
            <stop offset="100%" stop-color="#05030b" />
          </linearGradient>
        </defs>

        <!-- Sky -->
        <rect width="1440" height="900" fill="url(#skyGrad)" />

        <!-- Stars -->
        <g fill="#ffffff">
          <circle cx="120" cy="90" r="1.6" class="star" />
          <circle cx="260" cy="180" r="1.2" class="star" style="animation-delay:.4s" />
          <circle cx="380" cy="70" r="1.8" class="star" style="animation-delay:1.1s" />
          <circle cx="520" cy="150" r="1.2" class="star" style="animation-delay:.7s" />
          <circle cx="640" cy="60" r="1.5" class="star" style="animation-delay:1.6s" />
          <circle cx="820" cy="120" r="1.3" class="star" style="animation-delay:.2s" />
          <circle cx="960" cy="50" r="1.7" class="star" style="animation-delay:1.9s" />
          <circle cx="1100" cy="140" r="1.2" class="star" style="animation-delay:.9s" />
          <circle cx="1240" cy="90" r="1.6" class="star" style="animation-delay:.5s" />
          <circle cx="1340" cy="200" r="1.3" class="star" style="animation-delay:1.3s" />
          <circle cx="70" cy="230" r="1.1" class="star" style="animation-delay:2.1s" />
          <circle cx="700" cy="220" r="1.1" class="star" style="animation-delay:1.5s" />
          <circle cx="1180" cy="260" r="1.2" class="star" style="animation-delay:.6s" />
          <circle cx="440" cy="250" r="1" class="star" style="animation-delay:1.8s" />
          <circle cx="150" cy="320" r="1.2" class="star" style="animation-delay:.3s" />
          <circle cx="990" cy="290" r="1.4" class="star" style="animation-delay:2.3s" />
          <circle cx="600" cy="310" r="1" class="star" style="animation-delay:1.2s" />
        </g>

        <!-- Glowing moon -->
        <g>
          <circle cx="1080" cy="190" r="150" fill="url(#moonGlow)">
            <animate attributeName="r" values="150;170;150" dur="5s" repeatCount="indefinite" />
          </circle>
          <circle cx="1080" cy="190" r="62" fill="url(#moonFace)" />
          <circle cx="1058" cy="172" r="9" fill="#e8c98f" opacity="0.55" />
          <circle cx="1102" cy="205" r="6" fill="#e8c98f" opacity="0.5" />
          <circle cx="1066" cy="212" r="4" fill="#e8c98f" opacity="0.4" />
        </g>

        <!-- Distant city skyline -->
        <g fill="url(#skylineGrad)">
          <rect x="-20" y="640" width="200" height="180" />
          <path d="M-20 640 L80 560 L180 640 Z" />
          <rect x="180" y="660" width="180" height="160" />
          <path d="M180 660 L270 580 L360 660 Z" />
          <rect x="360" y="645" width="240" height="175" />
          <path d="M360 645 L480 545 L600 645 Z" />
          <rect x="600" y="670" width="160" height="150" />
          <path d="M600 670 L680 595 L760 670 Z" />
          <rect x="820" y="650" width="220" height="170" />
          <path d="M820 650 L930 555 L1040 650 Z" />
          <rect x="1040" y="665" width="180" height="155" />
          <path d="M1040 665 L1130 580 L1220 665 Z" />
          <rect x="1220" y="645" width="240" height="175" />
          <path d="M1220 645 L1340 545 L1460 645 Z" />
        </g>

        <!-- Ground -->
        <rect x="0" y="800" width="1440" height="100" fill="url(#groundGrad)" />

        <!-- Soft record-player glow -->
        <circle cx="720" cy="740" r="160" fill="#ffd98a" opacity="0.05" />
        <circle cx="720" cy="740" r="80" fill="#ffd98a" opacity="0.05" />
      </svg>
    </div>

    <!-- Time & weather -->
    <div class="top-widget">
      <div class="weather glass" id="weatherBox" title="Weather" data-weather="">
        <span class="weather-icon" id="weatherIcon">🌙</span>
        <span class="weather-emoji" id="weatherTxt"></span>
        <span class="wx-rain" aria-hidden="true"></span>
        <span class="wx-snow" aria-hidden="true"></span>
        <span class="wx-bolt" aria-hidden="true"></span>
      </div>
      <div class="clock glass">
        <div class="clock-line">
          <span class="clock-time" id="clockTime">--:--</span>
          <span class="clock-ampm" id="clockAmPm">--</span>
        </div>
        <div class="clock-date" id="clockDate">—</div>
      </div>
    </div>

    <!-- Content -->
    <main class="content">
      <footer class="footer">
        <p>Some songs never get old ✨</p>
      </footer>
    </main>

    <!-- Song list panel (hidden until opened) -->
    <div class="list-panel glass" id="listPanel" hidden>
      <div class="list-header">
        <span class="list-title">🎧 The Love Rewind</span>
        <button class="list-close" id="listCloseBtn" aria-label="Close list">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
          </svg>
        </button>
      </div>
      <div class="list-items" id="listItems">
        <div class="list-empty" id="listEmpty">Loading songs…</div>
      </div>
    </div>

    <!-- Compact player -->
    <div class="player-wrap" id="playerWrap">
      <div class="player-top">
        <button class="pill" id="listBtn" aria-label="Open playlist">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zm16 0v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4z" />
          </svg>
          <span class="pill-label">Playlist</span>
          <span class="pill-count" id="listCount"></span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 10l5 5 5-5z" />
          </svg>
        </button>
        <div class="vol-wrap">
          <button class="pill" id="volBtn" aria-label="Volume">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
            </svg>
            <span class="pill-vol" id="volLabel">70</span>
          </button>
          <div class="volume-popover glass" id="volumePopover" hidden>
            <input type="range" id="volumeSlider" class="pb-range" min="0" max="100" value="70" aria-label="Volume level" />
          </div>
        </div>
      </div>

      <div class="player-card glass">
        <img class="pc-cover" id="songCover" alt="Song cover" />
        <div class="pc-mid">
          <div class="pc-title" id="songTitle">Loading playlist…</div>
          <div class="pc-artist" id="songArtist">&nbsp;</div>
          <div class="pc-progress">
            <span class="pc-time" id="curTime">0:00</span>
            <input type="range" id="progressBar" class="pb-range" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
            <span class="pc-time" id="durTime">0:00</span>
          </div>
        </div>
        <div class="pc-controls">
          <button class="pc-btn" id="back10Btn" aria-label="Back 10 seconds">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
              <text x="12" y="15.5" text-anchor="middle" font-size="5.5" fill="currentColor">10</text>
            </svg>
          </button>
          <button class="pc-btn" id="prevBtn" aria-label="Previous song">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
            </svg>
          </button>
          <button class="pc-btn pc-play" id="playBtn" aria-label="Play or pause">
            <svg id="playIco" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg id="pauseIco" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
          <button class="pc-btn" id="nextBtn" aria-label="Next song">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
            </svg>
          </button>
          <button class="pc-btn" id="fwd10Btn" aria-label="Forward 10 seconds">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 13c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6v4l5-5-5-5v4c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8h-2z" />
              <text x="12" y="15.5" text-anchor="middle" font-size="5.5" fill="currentColor">10</text>
            </svg>
          </button>
        </div>
      </div>

      <div class="pc-note" id="songNote">Love vibes, always 🎧</div>
    </div>

    <!-- Ad-free HTML5 audio -->
    <audio id="audioPlayer" class="audio-player" preload="auto"></audio>

    <script src="songs.js?v=1"></script>
    <script src="script.js?v=1"></script>
  </body>
</html>
